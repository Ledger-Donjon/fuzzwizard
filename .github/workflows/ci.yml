name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: REUSE compliance check
      uses: fsfe/reuse-action@v5

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: "clippy, rustfmt"

    - name: Build
      run: cargo build --verbose

    # TODO
    # - name: Run tests
    #   run: cargo test --verbose

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint with Clippy
      run: cargo clippy -- -Dwarnings

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    # Fails on advisories with a known fix. Unmaintained/unsound notices are
    # reported but do not break the build, as they often have no upgrade path.
    - name: Audit dependencies against the RustSec advisory database
      run: cargo audit

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install cargo-cyclonedx
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-cyclonedx

    - name: Generate CycloneDX SBOMs
      run: cargo cyclonedx --all --spec-version 1.5 --format json --no-build-deps

    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: ./**/bom.json

  third-party-licenses:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install cargo-about
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-about

    - name: Generate third-party license report
      run: mkdir -p doc && cargo about generate about.hbs -o doc/THIRD_PARTY_LICENSES.html -c about.toml

    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: third-party-licenses
        path: doc/THIRD_PARTY_LICENSES.html
