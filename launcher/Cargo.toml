[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.19", features = ["json", "blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
which = "6.0.3"
thiserror = "1.0.64"
scheduler = { path = "../scheduler" }
sha3 = "0.10"
hex = "0.4"
env_logger = "0.11"
log = "0.4"
humantime = "2.3.0"
