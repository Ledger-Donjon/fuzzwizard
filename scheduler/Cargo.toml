[package]
name = "scheduler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
log = "0.4.27"
reqwest = { version = "0.12.19", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha3 = "0.10.8"
thiserror = "1.0"
ftail = "0.3"
rand = "0.9.3"
chrono = { version = "0.4.42", features = ["serde"] }
hex = "0.4.3"
ctrlc = "3.4"
humantime = "2.3.0"

[dev-dependencies]
assert_fs = "1.1.2"
