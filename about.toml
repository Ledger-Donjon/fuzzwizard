# Configuration for cargo-about (https://github.com/EmbarkStudios/cargo-about)
# Generates doc/THIRD_PARTY_LICENSES.html from Cargo.lock

accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
