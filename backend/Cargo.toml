[package]
name = "backend"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = {version = "0.8.3", features = ["macros"] }
chrono = {version = "0.4.41", features = ["serde"] }
diesel = { version = "2.3.8", features = ["postgres", "chrono", "r2d2"] }
r2d2 = "0.8"
log = "0.4.28"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
ftail = "0.3"
